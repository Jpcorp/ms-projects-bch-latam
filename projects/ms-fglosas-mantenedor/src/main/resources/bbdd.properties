#######################################################
## This file holds all the BBDD related properties
#######################################################

## Datasource configuration
spring.datasource.dataSourceClassName=oracle.jdbc.OracleDriver
spring.datasource.url=${DS_CONNECTION_URL}

## Solo para efectos deploy en local
#spring.datasource.url=jdbc:oracle:thin:@${DS_CONNECTION_HOST}:${DS_CONNECTION_DBPORT}/${DS_CONNECTION_DB}.netdevdbcs.vcndevscl.oraclevcn.com
#spring.datasource.username=${DS_CONNECTION_USERNAME}
#spring.datasource.password=${DS_CONNECTION_PASSWORD}

## Hikari configuration for Datasource connection pool
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=0

## JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


